name: Release Linux x86_64

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test and lint
        run: |
          cargo test --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble distribution archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="aula-f75-v${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${archive}/udev" "dist/${archive}/packaging" "dist/${archive}/assets"
          install -Dm755 target/release/aula-f75 "dist/${archive}/aula-f75"
          install -Dm644 udev/70-aula-f75.rules "dist/${archive}/udev/70-aula-f75.rules"
          install -Dm644 packaging/aula-f75-rs.desktop "dist/${archive}/packaging/aula-f75-rs.desktop"
          install -Dm644 assets/icon-source.png "dist/${archive}/assets/icon-source.png"
          install -Dm644 assets/screenshot-aula-f75-rs.png "dist/${archive}/assets/screenshot-aula-f75-rs.png"
          install -Dm644 assets/LICENSE-NerdFonts.txt "dist/${archive}/assets/LICENSE-NerdFonts.txt"
          install -Dm644 LICENSE "dist/${archive}/LICENSE"
          install -Dm644 LICENSES/aula-f75-hub-MIT.txt "dist/${archive}/LICENSES/aula-f75-hub-MIT.txt"
          for size in 64 128 256; do
            icon="icons/hicolor/${size}x${size}/apps/aula-f75-rs.png"
            install -Dm644 "assets/${icon}" "dist/${archive}/${icon}"
          done
          install -Dm644 README.md "dist/${archive}/README.md"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          (
            cd dist
            sha256sum "${archive}.tar.gz" > SHA256SUMS
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
