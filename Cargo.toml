[package]
name = "aula-f75"
version = "0.1.0"
edition = "2021"
description = "Linux x86_64 (hidraw) configuration tool for the AULA F75 keyboard"

[dependencies]
hidapi = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
eframe = "0.29"
catppuccin-egui = { version = "5.7", default-features = false, features = ["egui29"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
strip = true
lto = true
